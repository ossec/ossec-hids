          ./src/issue_ae2i21jq_pid_sleep
          make -C src -f tests/regressions/Makefile issue_b5y9piu1_policy_owner
          ./src/issue_b5y9piu1_policy_owner
          make -C src -f tests/regressions/Makefile issue_2138nb95_report_changes_symlink
          ./src/issue_2138nb95_report_changes_symlink
          make -C src -f tests/regressions/Makefile issue_j8xf7lcx_file_max_size
          ./src/issue_j8xf7lcx_file_max_size
          make -C src -f tests/regressions/Makefile issue_mbh20u16_dirfd_walk
          ./src/issue_mbh20u16_dirfd_walk
          make -C src -f tests/regressions/Makefile issue_4t9f7xiq_diff_store
          ./src/issue_4t9f7xiq_diff_store

  build-windows-agent:
    name: Windows agent (cross-compile)
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install \
            gcc \
            make \
            mingw32-gcc \
            mingw32-binutils \
            mingw32-nsis \
            mingw32-pcre2 \
            mingw32-zlib \
            mingw32-openssl \
            perl \
            wget \
            tar \
            perl-Time-HiRes \
            which

      - name: Build Windows agent
        run: |
          cd src
          make TARGET=winagent PCRE2_SYSTEM=yes ZLIB_SYSTEM=yes -j$(nproc)

      - name: Verify win32ui manifest (issue 2307)
        run: src/tests/regressions/issue_2307_win32ui_manifest.sh
