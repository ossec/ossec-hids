# Multi-platform build workflow.
# Initial CI structure and idea from PR #2158 by @cmac9203. Adapted to use the
# project's Make-based build (OSSEC-HIDS does not use CMake).
name: Build (multi-platform)

on:
  push:
    branches: [ "main", "master", "v4.2.0", "v4.3.0", "v4.4.0" ]
  pull_request:
    branches: [ "main", "master", "v4.2.0", "v4.3.0", "v4.4.0" ]
  workflow_dispatch:  # Run manually from Actions tab (choose branch)

jobs:
  build-rocky:
    name: Rocky Linux 9 (${{ matrix.target }}, USE_CURL=${{ matrix.use_curl }})
    runs-on: ubuntu-latest
    container: rockylinux:9
    strategy:
      fail-fast: false
      matrix:
        target: [ server, agent ]
        # Exercise optional libcurl SMTP path (curlmail.c) in CI, not only local builds.
        use_curl: [ no, yes ]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb || true
          dnf install -y gcc make openssl-devel pcre2-devel zlib-devel \
            systemd-devel libevent-devel diffutils
          dnf install -y file-devel || true
          if [ "${{ matrix.use_curl }}" = "yes" ]; then
            dnf install -y libcurl-devel
          fi

      - name: Build
        run: |
          cd src
          if [ "${{ matrix.use_curl }}" = "yes" ]; then
            make TARGET=${{ matrix.target }} PCRE2_SYSTEM=yes USE_CURL=yes -j$(nproc)
          else
            make TARGET=${{ matrix.target }} PCRE2_SYSTEM=yes -j$(nproc)
          fi

      - name: Run unit tests
        if: matrix.target == 'server'
        run: |
          make -C src/shared/tests thread_pool_test
          ./src/shared/tests/thread_pool_test
          make -C src/os_maild/tests mail_list_requeue_test sms_queue_test maild_shutdown_gate_test mail_utils_test
          ./src/os_maild/tests/mail_list_requeue_test
          ./src/os_maild/tests/sms_queue_test
          ./src/os_maild/tests/maild_shutdown_gate_test
          ./src/os_maild/tests/mail_utils_test
          make -C src/os_auth/tests auth_conn_drop_test
          ./src/os_auth/tests/auth_conn_drop_test
          make -C src -f tests/regressions/Makefile issue_2100_authd_ssl
          ./src/issue_2100_authd_ssl
          make -C src -f tests/regressions/Makefile getalert_empty_filename
          ./src/getalert_empty_filename
          make -C src -f tests/regressions/Makefile issue_1o4bcxpr_createpid
          ./src/issue_1o4bcxpr_createpid
          make -C src -f tests/regressions/Makefile issue_ave66yb6_report_store
          ./src/issue_ave66yb6_report_store
          make -C src -f tests/regressions/Makefile issue_wi6tbpfx_cdb_value
          ./src/issue_wi6tbpfx_cdb_value
          make -C src -f tests/regressions/Makefile issue_wjnd95he_win_wildcard
          ./src/issue_wjnd95he_win_wildcard
          make -C src -f tests/regressions/Makefile issue_u64thxi1_ipv6_disconnect
          ./src/issue_u64thxi1_ipv6_disconnect
          make -C src -f tests/regressions/Makefile issue_7odkfi8f_alert_day_read
          ./src/issue_7odkfi8f_alert_day_read
          make -C src -f tests/regressions/Makefile issue_dxpirjgm_realtime_dir_replace
          ./src/issue_dxpirjgm_realtime_dir_replace
          make -C src -f tests/regressions/Makefile issue_16qlz097_realtime_rename
          ./src/issue_16qlz097_realtime_rename
          make -C src -f tests/regressions/Makefile issue_zno1mxtc_eventlog_dll_cache
          ./src/issue_zno1mxtc_eventlog_dll_cache
          make -C src -f tests/regressions/Makefile issue_5bg289fd_bmpstring_cn
          ./src/issue_5bg289fd_bmpstring_cn
          make -C src -f tests/regressions/Makefile issue_r3zy7cwm_field_null_decoder
          ./src/issue_r3zy7cwm_field_null_decoder
          make -C src -f tests/regressions/Makefile issue_q0uytpgc_udp_newline
          ./src/issue_q0uytpgc_udp_newline
          make -C src -f tests/regressions/Makefile issue_9q8lr4ny_syslog_placeholder
          ./src/issue_9q8lr4ny_syslog_placeholder
          make -C src -f tests/regressions/Makefile issue_nceh7rb6_json_rotate_flag
          ./src/issue_nceh7rb6_json_rotate_flag
          make -C src -f tests/regressions/Makefile issue_ygx1kkkt_dated_log_tail
          ./src/issue_ygx1kkkt_dated_log_tail
          make -C src -f tests/regressions/Makefile issue_9knxmd94_wildcard_cap
          ./src/issue_9knxmd94_wildcard_cap
          make -C src -f tests/regressions/Makefile issue_ajjellsq_db_symlink
          ./src/issue_ajjellsq_db_symlink
          make -C src -f tests/regressions/Makefile issue_5z4ox04e_agent_info_symlink
          ./src/issue_5z4ox04e_agent_info_symlink
